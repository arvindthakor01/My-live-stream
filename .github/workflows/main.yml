name: Live Stream From GitHub Link

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stream to YouTube
        run: |
          # Aapka naya video link yahan add kar diya gaya hai
          VIDEO_URL="https://github.com/arvindthakor01/My-live-stream/releases/download/v1/km_20260220-1_720p_30f_20260221_064634.mp4"
          
          # Aapki stream key
          STREAM_KEY="r4q6-qczk-kjrp-aw7u-bjfr"
          
          # FFmpeg command: Reconnection options ke saath taaki stream stable rahe
          ffmpeg -re -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 2 \
          -stream_loop -1 -i "$VIDEO_URL" \
          -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
          -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
